name: Build

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  release:
    types: [published, edited]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28'
    
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2
    
    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -A x64 -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Dump vcpkg logs on failure
      if: failure()
      run: |
        if (Test-Path "build/vcpkg-manifest-install.log") {
            Get-Content "build/vcpkg-manifest-install.log"
        } else {
            Write-Host "Log file not found."
        }

    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}} --parallel
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WindowLib-${{env.BUILD_TYPE}}
        path: |
          build/src/WindowLib/${{env.BUILD_TYPE}}/*.dll
          build/src/WindowLib/${{env.BUILD_TYPE}}/*.lib
          build/src/TestApp/${{env.BUILD_TYPE}}/*.exe
          build/src/TestApp/${{env.BUILD_TYPE}}/*.pdb
          src/WindowLib/IWindow.h
        if-no-files-found: error

  release-assets:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: WindowLib-${{env.BUILD_TYPE}}
        path: artifacts
    
    - name: Debug - List downloaded files
      run: |
        echo "=== Files in artifacts ==="
        find artifacts -type f
        echo "=== Directory structure ==="
        tree artifacts || ls -laR artifacts
    
    - name: Prepare release files
      run: |
        mkdir -p release
        
        find artifacts -name "*.lib" -exec cp {} release/justcwl.lib \;
        find artifacts -name "*.dll" -exec cp {} release/justcwl.dll \;
        find artifacts -name "*.exe" -exec cp {} release/test.exe \;
        find artifacts -name "*.pdb" -exec cp {} release/test.pdb \;
        find artifacts -name "*.h" -exec cp {} release/IWindow.h \;
        
        echo "=== Release files ==="
        ls -la release/
        
        if [ ! -f "release/justcwl.lib" ]; then
          echo "ERROR: justcwl.lib not found!"
          exit 1
        fi
        
        if [ ! -f "release/test.exe" ]; then
          echo "ERROR: test.exe not found!"
          exit 1
        fi
        
        if [ ! -f "release/IWindow.h" ]; then
          echo "ERROR: IWindow.h not found!"
          exit 1
        fi
    
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release/justcwl.lib
          release/test.exe
          release/IWindow.h
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
