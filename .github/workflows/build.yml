name: Build

on:
  push:
    branches: [ main, develop ]
    tags:
  release:
    types: [published, edited]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28'
    
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2
    
    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -A x64 -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Dump vcpkg logs on failure
      if: failure()
      run: |
        if (Test-Path "build/vcpkg-manifest-install.log") {
            Get-Content "build/vcpkg-manifest-install.log"
        } else {
            Write-Host "Log file not found."
        }

    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}} --parallel
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WindowLib-${{env.BUILD_TYPE}}
        path: |
          build/src/WindowLib/${{env.BUILD_TYPE}}/WindowLib.dll
          build/src/WindowLib/${{env.BUILD_TYPE}}/WindowLib.lib
          build/src/TestApp/${{env.BUILD_TYPE}}/TestApp.exe
          build/src/TestApp/${{env.BUILD_TYPE}}/TestApp.pdb

  release-assets:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - run: |
        mkdir release
        cp artifacts/**/*.dll release/ || true
        cp artifacts/**/*.lib release/ || true
    - uses: softprops/action-gh-release@v2
      with:
        files: |
          release/*
